# Shared RenderCV design — tuned to reproduce Denys's approved sb2nov look
# (Roboto sans-serif, one page, no footer/top-note, tight spacing).
# Edit here to restyle every variant at once; no code changes needed.
theme: sb2nov
page:
  size: us-letter
  top_margin: 0.5in
  bottom_margin: 0.5in
  left_margin: 0.5in
  right_margin: 0.5in
  show_footer: false
  show_top_note: false
typography:
  line_spacing: 0.5em
  font_family:
    body: Roboto
    name: Roboto
    headline: Roboto
    connections: Roboto
    section_titles: Roboto
  # sb2nov defaults the headline (the position/title line) to non-bold, which
  # reads thin next to the bold name. Bold it so the subtitle matches the name.
  bold:
    name: true
    headline: true
    connections: false
    section_titles: true
header:
  connections:
    # Default is 'national', which drops the country code (Irish +353… -> 085…).
    # 'international' keeps the +353 country code in the rendered header.
    phone_number_format: international
sections:
  space_between_regular_entries: 0.6em
  space_between_text_based_entries: 0.2em
entries:
  highlights:
    bullet: •
    space_between_items: 0em
